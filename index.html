<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>∞ archive</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;500&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at top, #1a1a1a 0%, #050505 60%);
  font-family:'Inter',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

/* grain overlay */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:url('https://grainy-gradients.vercel.app/noise.svg');
  opacity:.08;
  mix-blend-mode:soft-light;
  pointer-events:none;
}

/* main card */
.container{
  position:relative;
  width:370px;
  height:700px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
  backdrop-filter:blur(20px);
  border-radius:32px;
  overflow:hidden;
  box-shadow:
    0 0 60px rgba(255,255,255,.03),
    inset 0 0 30px rgba(255,255,255,.03);
}

/* top text */
.header{
  position:absolute;
  top:30px;
  left:30px;
  z-index:5;
}

.header h1{
  font-family:'Orbitron',sans-serif;
  font-size:15px;
  letter-spacing:4px;
  font-weight:600;
  opacity:.8;
}

.header p{
  margin-top:8px;
  font-size:12px;
  opacity:.45;
  letter-spacing:2px;
}

/* infinity wrapper */
.infinity-wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* infinity shape */
.infinity{
  position:relative;
  width:270px;
  height:140px;
  animation:float 6s ease-in-out infinite;
}

/* path glow */
.infinity::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:100px;
  filter:blur(40px);
  background:rgba(255,255,255,.08);
}

/* left & right loops */
.loop{
  position:absolute;
  width:170px;
  height:170px;
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:50%;
  overflow:hidden;
}

.left{
  left:0;
  top:5px;
}

.right{
  right:0;
  top:5px;
}

/* center crossing */
.center{
  position:absolute;
  left:50%;
  top:50%;
  width:80px;
  height:1px;
  background:rgba(255,255,255,.15);
  transform:translate(-50%,-50%) rotate(-25deg);
  filter:blur(.2px);
}

/* photos */
.photo{
  position:absolute;
  width:90px;
  height:90px;
  border-radius:20px;
  object-fit:cover;
  object-position:center;
  filter:grayscale(.05) contrast(1.05);
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  transition:.5s;
}

/* floating positions */
.p1{
  top:18px;
  left:18px;
  transform:rotate(-8deg);
}

.p2{
  bottom:18px;
  right:18px;
  transform:rotate(6deg);
}

.p3{
  top:18px;
  right:18px;
  transform:rotate(8deg);
}

.p4{
  bottom:18px;
  left:18px;
  transform:rotate(-5deg);
}

/* subtle hover */
.photo:hover{
  transform:scale(1.06);
}

/* bottom text */
.footer{
  position:absolute;
  bottom:38px;
  width:100%;
  text-align:center;
}

.footer h2{
  font-size:14px;
  font-weight:500;
  letter-spacing:2px;
  opacity:.85;
}

.footer span{
  display:block;
  margin-top:10px;
  font-size:11px;
  letter-spacing:3px;
  opacity:.35;
}

/* little stars */
.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  opacity:.6;
  animation:blink 3s infinite;
}

.s1{top:15%;left:18%;}
.s2{top:25%;right:20%;}
.s3{bottom:18%;left:22%;}
.s4{bottom:28%;right:18%;}

@keyframes float{
  0%,100%{
    transform:translateY(0px);
  }
  50%{
    transform:translateY(-10px);
  }
}

@keyframes blink{
  0%,100%{
    opacity:.2;
    transform:scale(1);
  }
  50%{
    opacity:.8;
    transform:scale(1.8);
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>∞ ARCHIVE</h1>
    <p>2000s emotional interface</p>
  </div>

  <div class="infinity-wrap">

    <div class="infinity">

      <div class="loop left">
  <img src="assets/IMG_0982.jpeg" class="photo p1">
  <img src="assets/IMG_0986.jpeg" class="photo p2">
</div>

<div class="loop right">
  <img src="assets/IMG_0818.jpeg" class="photo p3">
  <img src="assets/IMG_0817.jpeg" class="photo p4">
</div>

      <div class="center"></div>

    </div>

  </div>

  <div class="footer">
    <h2>you looked unreal that night</h2>
    <span>saved permanently</span>
  </div>

  <div class="star s1"></div>
  <div class="star s2"></div>
  <div class="star s3"></div>
  <div class="star s4"></div>

</div>

</body>
</html>
