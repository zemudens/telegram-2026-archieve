<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>∞ archive</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;500&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  background: radial-gradient(circle at top, #1a1a1a 0%, #050505 60%);
  font-family:'Inter',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

body::before{
  content:"";
  position:absolute;
  inset:0;
  background:url('https://grainy-gradients.vercel.app/noise.svg');
  opacity:.08;
  mix-blend-mode:soft-light;
  pointer-events:none;
}

.container{
  position:relative;
  width:370px;
  height:700px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
  backdrop-filter:blur(20px);
  border-radius:32px;
  overflow:hidden;
}

.header{
  position:absolute;
  top:30px;
  left:30px;
  z-index:5;
}

.header h1{
  font-family:'Orbitron',sans-serif;
  font-size:15px;
  letter-spacing:4px;
  opacity:.8;
}

.header p{
  margin-top:8px;
  font-size:12px;
  opacity:.45;
}

.infinity-wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.infinity{
  position:relative;
  width:270px;
  height:140px;
  animation:float 6s ease-in-out infinite;
}

.loop{
  position:absolute;
  width:170px;
  height:170px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
}

.left{ left:0; top:5px; }
.right{ right:0; top:5px; }

.center{
  position:absolute;
  left:50%;
  top:50%;
  width:80px;
  height:1px;
  background:rgba(255,255,255,.15);
  transform:translate(-50%,-50%) rotate(-25deg);
}

.photo{
  position:absolute;
  width:90px;
  height:90px;
  border-radius:20px;
  object-fit:cover;
  filter:grayscale(.05) contrast(1.05);
  transition:.5s;
}

.p1{ top:18px; left:18px; transform:rotate(-8deg); }
.p2{ bottom:18px; right:18px; transform:rotate(6deg); }
.p3{ top:18px; right:18px; transform:rotate(8deg); }
.p4{ bottom:18px; left:18px; transform:rotate(-5deg); }

.photo:hover{ transform:scale(1.06); }

.footer{
  position:absolute;
  bottom:38px;
  width:100%;
  text-align:center;
}

.footer h2{
  font-size:14px;
  letter-spacing:2px;
}

.footer span{
  display:block;
  margin-top:10px;
  font-size:11px;
  opacity:.35;
}

.live-lyrics{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Orbitron',sans-serif;
  font-size:16px;
  letter-spacing:4px;
  color:rgba(255,255,255,.08);
  text-align:center;
  pointer-events:none;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  opacity:.6;
  animation:blink 3s infinite;
}

.s1{top:15%;left:18%;}
.s2{top:25%;right:20%;}
.s3{bottom:18%;left:22%;}
.s4{bottom:28%;right:18%;}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

@keyframes blink{
  0%,100%{opacity:.2;}
  50%{opacity:.8;}
}
</style>
</head>

<body>

<audio id="bgm" loop>
  <source src="assets/rosemary.mp3" type="audio/mpeg">
</audio>

<div class="container">

  <div class="live-lyrics" id="lyrics"></div>

  <div class="header">
    <h1>∞ ARCHIVE</h1>
    <p>2000s emotional interface</p>
  </div>

  <div class="infinity-wrap">
    <div class="infinity">

      <div class="loop left">
        <img src="assets/IMG_0982.jpeg" class="photo p1">
        <img src="assets/IMG_0986.jpeg" class="photo p2">
      </div>

      <div class="loop right">
        <img src="assets/IMG_0818.jpeg" class="photo p3">
        <img src="assets/IMG_0817.jpeg" class="photo p4">
      </div>

      <div class="center"></div>
    </div>
  </div>

  <div class="footer">
    <h2>you looked unreal that night</h2>
    <span>saved permanently</span>
  </div>

  <div class="star s1"></div>
  <div class="star s2"></div>
  <div class="star s3"></div>
  <div class="star s4"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("bgm");
  const lyrics = document.getElementById("lyrics");

  const lines = [
    { time: 0, text: "" },
    { time: 59, text: "there's no sound" },
    { time: 68, text: "but the engine's drone" },
    { time: 75, text: "our minds set free" },
    { time: 83, text: "to roam" },
    { time: 104, text: "time (shift)" },
    { time: 108, text: "we discover the entry" },
    { time: 115, text: "to other planes" },
    { time: 118, text: "our minds bend" },
    { time: 124, text: "and our fingers fold" },
    { time: 132, text: "entwined, we dream" },
    { time: 140, text: "unknown" },
    { time: 146, text: "time (shift)" },
    { time: 150, text: "we discover the entry" },
    { time: 160, text: "stay with me" },
    { time: 167, text: "as we cross the empty skies" },
    { time: 173, text: "come sail with me" },
    { time: 196, text: "we slow down" },
    { time: 203, text: "as the engines stall" },
    { time: 211, text: "our eyes catch sync" },
    { time: 219, text: "explode" },
    { time: 225, text: "time (shift)" },
    { time: 230, text: "we discover the entry" },
    { time: 235, text: "to other planes" },
    { time: 240, text: "time (shift)" },
    { time: 244, text: "as we collide with the energy" },
    { time: 251, text: "in other ways" },
    { time: 255, text: "stay with me" },
    { time: 261, text: "as we cross the empty skies" },
    { time: 269, text: "come sail with me" },
    { time: 276, text: "we play in dreams" },
    { time: 283, text: "as we cross through space and time" },
    { time: 291, text: "just stay with me" }
  ];

function updateLyrics() {
  const t = audio.currentTime;

  for (let i = lines.length - 1; i >= 0; i--) {
    if (t >= lines[i].time) {
      if (lyrics.innerText !== lines[i].text) {
        lyrics.innerText = lines[i].text;
      }
      break;
    }
  }

  requestAnimationFrame(updateLyrics);
}

  audio.volume = 0;

function startAudio() {
  audio.currentTime = 0;
  lyrics.innerText = "";

  audio.play().catch(()=>{});

  let v = 0;
  const fade = setInterval(() => {
    if (v < 0.35) {
      v += 0.02;
      audio.volume = v;
    } else clearInterval(fade);
  }, 120);

  requestAnimationFrame(updateLyrics);
}

  window.addEventListener("click", startAudio, { once:true });
  window.addEventListener("touchstart", startAudio, { once:true });

});
</script>

</body>
</html>
